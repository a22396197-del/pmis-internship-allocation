services:
  - type: web
    name: pmis-internship-allocation
    env: python
    region: singapore
    plan: free
    buildCommand: "./build.sh"
    startCommand: "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
